<meta charset="utf-8">
<style>
  :root { color-scheme: light dark; }
  body { font: 13px/1.5 ui-sans-serif, system-ui, sans-serif; width: 320px; margin: 0; padding: 12px; }
  h1 { font-size: 13px; margin: 0 0 10px; letter-spacing: .02em; }
  .row { display: flex; gap: 8px; align-items: baseline; margin-bottom: 6px; }
  .k { opacity: .6; width: 82px; flex: none; }
  .v { flex: 1; word-break: break-all; }
  .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; margin-right: 6px; }
  .up { background: #16a34a; } .down { background: #dc2626; }
  label { display: block; opacity: .6; margin: 10px 0 3px; }
  input, button, select { font: inherit; padding: 4px 6px; }
  input, select { width: 100%; box-sizing: border-box; }
  .actions { display: flex; gap: 6px; margin-top: 10px; }
  .actions button { flex: 1; }
  .err { color: #dc2626; margin-top: 8px; white-space: pre-wrap; }
  .hint { opacity: .55; margin-top: 6px; }
</style>
<h1>aipass bridge</h1>
<div class="row"><span class="k">bridge</span><span class="v" id="conn"></span></div>
<div class="row"><span class="k">chat tab</span><span class="v" id="tab"></span></div>
<div class="row"><span class="k">active jobs</span><span class="v" id="jobs"></span></div>

<label for="model">Default model <span id="count"></span></label>
<select id="model"></select>

<label for="url">Bridge URL</label>
<input id="url" spellcheck="false" placeholder="http://127.0.0.1:8787">

<label for="token">Bearer token</label>
<input id="token" type="password" spellcheck="false" placeholder="leave blank if not set">

<div class="actions">
  <button id="save">Save &amp; reconnect</button>
  <button id="refresh">Refresh models</button>
</div>
<div class="hint">Used only when a client sends no model of its own.</div>
<div class="err" id="err"></div>
<script src="popup.js"></script>
